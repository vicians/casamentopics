name = "casamento-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Bucket R2 onde as fotos são gravadas.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "casamento-fotos"

# Banco D1 com os metadados (nome do convidado, data) e as reações.
# Depois de rodar `wrangler d1 create casamento`, cole aqui o database_id retornado.
[[d1_databases]]
binding = "DB"
database_name = "casamento"
database_id = "391701a8-c005-4410-a1e8-45c41dbdb7db"

# Rate limit de uploads por IP (aproximado, por localização da Cloudflare).
# 1200 uploads por 60s por IP — generoso de propósito, pois convidados no mesmo
# Wi-Fi compartilham o IP e cada lembrança gera 2 requisições (mídia + miniatura).
# Serve para barrar spam/abuso, não convidados.
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 1200
  period = 60

# Logs no painel da Cloudflare (útil para diagnosticar o dia do evento).
[observability]
enabled = true
